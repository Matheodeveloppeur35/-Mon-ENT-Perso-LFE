<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mes devoirs - Mon ENT Perso LFE</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* =========================
           EN-TÊTE
        ========================= */

        .page-header {
            margin-bottom: 25px;
        }

        .page-header p {
            color: #64748b;
            margin-top: 5px;
        }


        /* =========================
           STATISTIQUES
        ========================= */

        .homework-stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 25px;
        }

        .stat-card {

            background: white;

            padding: 20px;

            border-radius: 16px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.06);

        }

        .stat-card span {

            display: block;

            color: #64748b;

            font-size: 13px;

            margin-bottom: 8px;
        }

        .stat-card strong {

            font-size: 27px;

            color: #172033;
        }

        .stat-card.todo strong {
            color: #dc2626;
        }

        .stat-card.done strong {
            color: #16a34a;
        }

        .stat-card.late strong {
            color: #ea580c;
        }


        /* =========================
           BLOCS
        ========================= */

        .tools,
        .add-homework,
        .edit-homework,
        .homework-section {

            background: white;

            padding: 25px;

            border-radius: 18px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.06);
        }


        /* =========================
           OUTILS
        ========================= */

        .tools {

            display: grid;

            grid-template-columns:
                minmax(220px, 1fr)
                180px
                220px
                180px;

            gap: 12px;

        }

        .search-box input,
        .tools select {

            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            border:
                1px solid #dbe2ea;

            border-radius: 10px;

            font-family: inherit;

            background: white;

        }

        .search-box input:focus,
        .tools select:focus {

            outline: none;

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37,99,235,0.1);

        }


        /* =========================
           FORMULAIRE
        ========================= */

        .homework-form {

            display: grid;

            gap: 15px;
        }

        .homework-form label {

            display: block;

            font-weight: bold;

            margin-bottom: 6px;
        }

        .homework-form input,
        .homework-form textarea,
        .homework-form select {

            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            border:
                1px solid #dbe2ea;

            border-radius: 10px;

            font-family: inherit;

        }

        .homework-form textarea {

            min-height: 100px;

            resize: vertical;
        }

        .homework-form button {

            border: none;

            background: #2563eb;

            color: white;

            padding: 13px;

            border-radius: 10px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .homework-form button:hover {

            background: #1d4ed8;

            transform: translateY(-1px);
        }


        /* =========================
           TITRE LISTE
        ========================= */

        .homework-section-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 20px;
        }

        .homework-section-header h2 {
            margin: 0;
        }

        .homework-count {

            background: #eff6ff;

            color: #1d4ed8;

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;

            white-space: nowrap;
        }


        /* =========================
           LISTE
        ========================= */

        .homework-list {

            display: grid;

            gap: 15px;
        }


        /* =========================
           CARTE
        ========================= */

        .homework-card {

            position: relative;

            border-left:
                5px solid #2563eb;

            background: #f8fafc;

            padding: 20px;

            border-radius: 12px;

            transition: 0.2s;
        }

        .homework-card:hover {

            transform: translateY(-2px);

            box-shadow:
                0 6px 18px
                rgba(0,0,0,0.07);
        }

        .homework-card.done {

            border-left-color: #16a34a;

            opacity: 0.75;
        }

        .homework-card.overdue {

            border-left-color: #dc2626;

            background: #fff7f7;
        }

        .homework-card h3 {

            margin-top: 0;

            margin-bottom: 10px;

            color: #172033;
        }


        /* =========================
           INFORMATIONS
        ========================= */

        .homework-info {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin: 12px 0;
        }

        .badge {

            background: #e2e8f0;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;
        }

        .badge-date {

            background: #dbeafe;

            color: #1d4ed8;
        }

        .badge-done {

            background: #dcfce7;

            color: #15803d;
        }

        .badge-todo {

            background: #fef3c7;

            color: #b45309;
        }

        .badge-late {

            background: #fee2e2;

            color: #b91c1c;
        }


        /* =========================
           DESCRIPTION
        ========================= */

        .homework-description {

            color: #475569;

            line-height: 1.6;

            margin: 12px 0;
        }


        /* =========================
           BOUTONS
        ========================= */

        .homework-actions {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin-top: 15px;
        }

        .homework-actions button {

            border: none;

            color: white;

            padding: 9px 13px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            transition: 0.2s;
        }

        .homework-actions button:hover {

            transform: translateY(-1px);

            opacity: 0.9;
        }

        .complete-button {

            background: #16a34a;
        }

        .edit-button {

            background: #2563eb;
        }

        .delete-button {

            background: #dc2626;
        }


        /* =========================
           AUCUN RÉSULTAT
        ========================= */

        .empty-message {

            text-align: center;

            padding: 40px 20px;

            color: #64748b;
        }

        .empty-message-icon {

            font-size: 45px;

            margin-bottom: 10px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .homework-stats {

                grid-template-columns:
                    repeat(2, 1fr);
            }

            .tools {

                grid-template-columns:
                    1fr 1fr;
            }

        }

        @media (max-width: 700px) {

            .homework-stats {

                grid-template-columns: 1fr 1fr;

            }

            .tools {

                grid-template-columns: 1fr;

            }

            .homework-section-header {

                align-items: flex-start;

                flex-direction: column;
            }

            .homework-actions {

                flex-direction: column;
            }

            .homework-actions button {

                width: 100%;
            }

        }

        @media (max-width: 450px) {

            .homework-stats {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         MENU
    ========================= -->

    <aside class="sidebar">

        <div class="logo">

            🎓

            <h2>Mon ENT</h2>

            <span>Perso LFE</span>

        </div>


        <nav>

            <a href="index.html">
                🏠 Accueil
            </a>

            <a href="emploi-du-temps.html">
                📅 Emploi du temps
            </a>

            <a href="mes-cours.html">
                📚 Mes cours
            </a>

            <a
                href="mes-devoirs.html"
                class="active"
            >
                📝 Mes devoirs
            </a>

            <a href="#">
                📊 Mes notes
            </a>

            <a href="#">
                📋 Mes contrôles
            </a>

        </nav>

    </aside>


    <!-- =========================
         CONTENU
    ========================= -->

    <main class="main-content">


        <header class="page-header">

            <h1>
                📝 Mes devoirs
            </h1>

            <p>
                Retrouve et organise tous tes devoirs.
            </p>

        </header>


        <!-- =========================
             STATISTIQUES
        ========================= -->

        <section class="homework-stats">

            <div class="stat-card">

                <span>
                    📚 Total
                </span>

                <strong id="stat-total">
                    0
                </strong>

            </div>


            <div class="stat-card todo">

                <span>
                    🔴 À faire
                </span>

                <strong id="stat-todo">
                    0
                </strong>

            </div>


            <div class="stat-card done">

                <span>
                    🟢 Terminés
                </span>

                <strong id="stat-done">
                    0
                </strong>

            </div>


            <div class="stat-card late">

                <span>
                    🚨 En retard
                </span>

                <strong id="stat-late">
                    0
                </strong>

            </div>

        </section>


        <!-- =========================
             OUTILS
        ========================= -->

        <section class="tools">

            <div class="search-box">

                <input
                    type="search"
                    id="search-homework"
                    placeholder="🔎 Rechercher un devoir..."
                >

            </div>


            <select id="status-filter">

                <option value="all">
                    📋 Tous
                </option>

                <option value="todo">
                    🔴 À faire
                </option>

                <option value="done">
                    🟢 Terminés
                </option>

                <option value="late">
                    🚨 En retard
                </option>

            </select>


            <select id="subject-filter">

                <option value="all">
                    📚 Toutes les matières
                </option>

                <option>Mathématiques</option>
                <option>Anglais LV1</option>
                <option>Français / Histoire-Géo / EMC</option>
                <option>Sciences physiques</option>
                <option>Enseignement professionnel</option>
                <option>Pratique professionnelle</option>
                <option>Arts appliqués / Culture artistique</option>
                <option>Soutien au parcours</option>
                <option>Prévention-Santé-Environnement</option>
                <option>Économie & Gestion</option>
                <option>Réalisation projet</option>
                <option>Éducation physique & sportive</option>

            </select>


            <select id="date-sort">

                <option value="asc">
                    📅 Plus proches
                </option>

                <option value="desc">
                    📅 Plus lointains
                </option>

            </select>

        </section>


        <!-- =========================
             AJOUT
        ========================= -->

        <section class="add-homework">

            <h2>
                ➕ Ajouter un devoir
            </h2>


            <form
                id="homework-form"
                class="homework-form"
            >

                <div>

                    <label for="homework-subject">
                        Matière
                    </label>

                    <select
                        id="homework-subject"
                        required
                    >

                        <option value="">
                            Sélectionner une matière
                        </option>

                        <option>Mathématiques</option>
                        <option>Anglais LV1</option>
                        <option>Français / Histoire-Géo / EMC</option>
                        <option>Sciences physiques</option>
                        <option>Enseignement professionnel</option>
                        <option>Pratique professionnelle</option>
                        <option>Arts appliqués / Culture artistique</option>
                        <option>Soutien au parcours</option>
                        <option>Prévention-Santé-Environnement</option>
                        <option>Économie & Gestion</option>
                        <option>Réalisation projet</option>
                        <option>Éducation physique & sportive</option>

                    </select>

                </div>


                <div>

                    <label for="homework-title">
                        Titre du devoir
                    </label>

                    <input
                        type="text"
                        id="homework-title"
                        placeholder="Ex : Exercices chapitre 2"
                        required
                    >

                </div>


                <div>

                    <label for="homework-date">
                        Date pour rendre le devoir
                    </label>

                    <input
                        type="date"
                        id="homework-date"
                        required
                    >

                </div>


                <div>

                    <label for="homework-description">
                        Description
                    </label>

                    <textarea
                        id="homework-description"
                        placeholder="Décris le travail à faire..."
                    ></textarea>

                </div>


                <button type="submit">
                    💾 Enregistrer le devoir
                </button>

            </form>

        </section>


        <!-- =========================
             MODIFICATION
        ========================= -->

        <section
            class="edit-homework"
            id="edit-homework-section"
            style="display:none;"
        >

            <h2>
                ✏️ Modifier le devoir
            </h2>


            <form
                id="edit-homework-form"
                class="homework-form"
            >

                <div>

                    <label for="edit-homework-subject">
                        Matière
                    </label>

                    <select
                        id="edit-homework-subject"
                        required
                    >

                        <option>Mathématiques</option>
                        <option>Anglais LV1</option>
                        <option>Français / Histoire-Géo / EMC</option>
                        <option>Sciences physiques</option>
                        <option>Enseignement professionnel</option>
                        <option>Pratique professionnelle</option>
                        <option>Arts appliqués / Culture artistique</option>
                        <option>Soutien au parcours</option>
                        <option>Prévention-Santé-Environnement</option>
                        <option>Économie & Gestion</option>
                        <option>Réalisation projet</option>
                        <option>Éducation physique & sportive</option>

                    </select>

                </div>


                <div>

                    <label for="edit-homework-title">
                        Titre
                    </label>

                    <input
                        type="text"
                        id="edit-homework-title"
                        required
                    >

                </div>


                <div>

                    <label for="edit-homework-date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="edit-homework-date"
                        required
                    >

                </div>


                <div>

                    <label for="edit-homework-description">
                        Description
                    </label>

                    <textarea
                        id="edit-homework-description"
                    ></textarea>

                </div>


                <button type="submit">
                    💾 Enregistrer les modifications
                </button>


                <button
                    type="button"
                    id="cancel-homework-edit"
                    style="background:#64748b;"
                >
                    Annuler
                </button>

            </form>

        </section>


        <!-- =========================
             LISTE
        ========================= -->

        <section class="homework-section">

            <div class="homework-section-header">

                <h2>
                    📚 Mes devoirs
                </h2>

                <span
                    class="homework-count"
                    id="homework-count"
                >
                    0 devoir
                </span>

            </div>


            <div
                class="homework-list"
                id="homework-list"
            ></div>

        </section>


    </main>


    <script src="js/mes-devoirs.js"></script>

</body>

</html>
